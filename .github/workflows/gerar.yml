name: Gerar APK e app web

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar o app web (um único HTML, offline)
        working-directory: web/build
        run: |
          npm ci --no-audit --no-fund
          python3 build.py
          python3 pwa.py

      - name: Versão
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          WEBVER=$(grep -oP "const VERSION = '\K[^']+" web/src/ui.js)
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Android $VER · web $WEBVER"
          if [ "$VER" != "$WEBVER" ]; then echo "::warning::versionName ($VER) diferente da versão do app web ($WEBVER)"; fi
          mkdir -p android/app/src/main/assets
          cp web/dist/folha-de-calculo.html android/app/src/main/assets/index.html

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar o APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Preparar os arquivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MathTi.apk
          cp out/MathTi.apk "out/MathTi-${VER}.apk"
          cp web/dist/folha-de-calculo.html out/MathTi-web.html
          cp out/MathTi-web.html "out/MathTi-web-${VER}.html"
          ls -l out

      - name: Publicar em Releases (links de download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VER}-b${{ github.run_number }}"
          gh release create "$TAG" out/* --latest \
            --title "MathTi ${VER} (compilação ${{ github.run_number }})" \
            --notes "**Android:** baixe **MathTi.apk** e instale no tablet.
          **Windows (offline):** baixe **MathTi-web.html** e abra com o Edge ou o Chrome.
          **Windows (instalável):** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ → menu do navegador → Instalar MathTi.

          Commit: ${{ github.sha }}"

      - name: Publicar o app web (GitHub Pages, ramo gh-pages)
        run: |
          cd web/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "App web MathTi ${VER} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Guardar o registro do erro (se falhar)
        if: failure()
        run: |
          mkdir -p /tmp/log && cd /tmp/log
          cp "$GITHUB_WORKSPACE/gradle.log" . 2>/dev/null || echo "sem gradle.log" > gradle.log
          echo "run ${{ github.run_number }} · ${{ github.sha }}" > info.txt
          git init -q -b ci-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "log da compilação ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
